<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Universidad</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            background-color: #004080;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h2 {
            border-bottom: 2px solid #004080;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }
        th {
            background-color: #004080;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .btn {
            display: inline-block;
            background-color: #004080;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #003366;
        }
        .btn-action {
            display: inline-block;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 3px;
            margin-bottom: 3px;
            border: none;
            cursor: pointer;
        }
        .btn-action:hover {
            opacity: 0.9;
        }
        .status {
            margin-top: 10px;
            font-style: italic;
            color: #666;
        }
        .password-hash {
            font-family: monospace;
            font-size: 11px;
            color: #666;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-reset-pass {
            background-color: #ffc107;
            color: #000;
            font-size: 11px;
            padding: 4px 8px;
        }
        .btn-reset-pass:hover {
            background-color: #e0a800;
        }
        .seo-panel {
            padding-top: 8px;
        }
        [hidden] {
            display: none !important;
        }
        .panel-tabs {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid #d7dee8;
            margin-bottom: 24px;
        }
        .panel-tab {
            border: 0;
            border-bottom: 3px solid transparent;
            background: transparent;
            color: #596579;
            padding: 12px 4px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .panel-tab[aria-selected="true"] {
            color: #004080;
            border-bottom-color: #004080;
        }
        .seo-pages {
            display: flex;
            gap: 4px;
            width: fit-content;
            padding: 4px;
            background: #edf1f5;
            border-radius: 6px;
            margin-bottom: 24px;
        }
        .seo-page {
            padding: 9px 22px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: #596579;
            font: inherit;
            cursor: pointer;
        }
        .seo-page[aria-pressed="true"] {
            background: white;
            color: #004080;
            box-shadow: 0 1px 3px #00000015;
        }
        .panel-tab:focus-visible,
        .seo-page:focus-visible {
            outline: 2px solid #004080;
            outline-offset: 3px;
        }
        .seo-grid {
            max-width: 720px;
        }
        .seo-card {
            min-width: 0;
            padding-bottom: 16px;
        }
        .seo-card h3 {
            margin: 0 0 12px;
            color: #004080;
        }
        .seo-card label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        .seo-card input,
        .seo-card textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 9px 10px;
            font: inherit;
        }
        .seo-card textarea {
            min-height: 74px;
            resize: vertical;
        }
        .seo-card input:focus,
        .seo-card textarea:focus {
            outline: 2px solid #004080;
            outline-offset: 1px;
        }
        .seo-card .btn {
            border: 0;
            font: inherit;
            cursor: pointer;
        }
        .seo-card .btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        @media (max-width: 600px) {
            .container {
                margin: 16px 10px;
                padding: 16px;
            }
            .header h1 {
                font-size: 24px;
            }
        }
        .seo-status {
            min-height: 18px;
            margin: 10px 0 0;
            font-size: 13px;
        }
        /* Modal de puntos */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 10px;
            padding: 32px 28px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            position: relative;
        }
        .modal-box h3 {
            margin: 0 0 18px;
            color: #004080;
            font-size: 1.2rem;
        }
        .modal-box label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            margin-top: 12px;
        }
        .modal-box input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .modal-box input:focus {
            outline: none;
            border-color: #004080;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .btn-modal-cancel {
            background: #eee;
            color: #333;
            border: none;
            padding: 9px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-modal-save {
            background: #004080;
            color: #fff;
            border: none;
            padding: 9px 22px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-modal-save:hover { background: #003366; }
        .btn-points { background-color: #17a2b8; }
        .btn-points:hover { background-color: #138496; }
        .modal-close-x {
            position: absolute;
            top: 10px; right: 14px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }
        /* Modal reset password */
        .modal-reset-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1001;
            align-items: center;
            justify-content: center;
        }
        .modal-reset-overlay.active { display: flex; }
        .modal-reset-box {
            background: #fff;
            border-radius: 10px;
            padding: 28px 24px 22px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            position: relative;
        }
        .modal-reset-box h3 {
            margin: 0 0 16px;
            color: #004080;
        }
        .modal-reset-box input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Panel de Administración General</h1>
        <p>Sistema de Gestión Universitaria</p>
    </div>

    <div class="container">
        <div class="panel-tabs" role="tablist" aria-label="Panel">
            <button id="users-tab" class="panel-tab" type="button" role="tab" aria-selected="true" aria-controls="users-panel" tabindex="0">Usuarios</button>
            <button id="seo-tab" class="panel-tab" type="button" role="tab" aria-selected="false" aria-controls="seo-panel" tabindex="-1">SEO</button>
        </div>
        <section id="seo-panel" class="seo-panel" role="tabpanel" aria-labelledby="seo-tab" hidden>
            <h2>SEO de paginas</h2>
            <div class="seo-pages" role="group" aria-label="Pagina">
                <button class="seo-page" type="button" data-page="login" aria-pressed="true" aria-controls="seo-login-form">/login</button>
                <button class="seo-page" type="button" data-page="index" aria-pressed="false" aria-controls="seo-index-form">/index</button>
            </div>
            <div class="seo-grid">
                <form id="seo-login-form" class="seo-card" data-page="login">
                    <h3>/login</h3>
                    <label for="seo-login-title">Titulo</label>
                    <input id="seo-login-title" name="title" type="text" required>
                    <label for="seo-login-description">Descripcion</label>
                    <textarea id="seo-login-description" name="description"></textarea>
                    <label for="seo-login-og-title">Titulo Open Graph</label>
                    <input id="seo-login-og-title" name="og_title" type="text">
                    <label for="seo-login-og-description">Descripcion Open Graph</label>
                    <textarea id="seo-login-og-description" name="og_description"></textarea>
                    <label for="seo-login-canonical">Canonical URL</label>
                    <input id="seo-login-canonical" name="canonical_url" type="url">
                    <button type="submit" class="btn">Guardar SEO /login</button>
                    <p class="seo-status" id="seo-login-status" role="status"></p>
                </form>

                <form id="seo-index-form" class="seo-card" data-page="index" hidden>
                    <h3>/index</h3>
                    <label for="seo-index-title">Titulo</label>
                    <input id="seo-index-title" name="title" type="text" required>
                    <label for="seo-index-description">Descripcion</label>
                    <textarea id="seo-index-description" name="description"></textarea>
                    <label for="seo-index-og-title">Titulo Open Graph</label>
                    <input id="seo-index-og-title" name="og_title" type="text">
                    <label for="seo-index-og-description">Descripcion Open Graph</label>
                    <textarea id="seo-index-og-description" name="og_description"></textarea>
                    <label for="seo-index-canonical">Canonical URL</label>
                    <input id="seo-index-canonical" name="canonical_url" type="url">
                    <button type="submit" class="btn">Guardar SEO /index</button>
                    <p class="seo-status" id="seo-index-status" role="status"></p>
                </form>
            </div>
        </section>

        <section id="users-panel" role="tabpanel" aria-labelledby="users-tab">
        <h2>Usuarios Registrados</h2>
        <form id="create-user-form" style="margin-bottom: 24px;">
            <input id="new-username" type="text" placeholder="Usuario o correo" required>
            <input id="new-password" type="password" placeholder="Contraseña" required minlength="4">
            <button type="submit" class="btn">Crear usuario</button>
        </form>
        <div class="status" id="status-message">Cargando datos...</div>
        
        <table id="users-table" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario / Correo</th>
                    <th>Contraseña (Hash)</th>
                    <th>OTP</th>
                    <th>Palabra clave</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="users-body">
                <!-- Data will be populated here -->
            </tbody>
        </table>

        <a href="/login.html" class="btn">Volver al Login</a>
        </section>
    </div>

    <script>
        const panelTabs = Array.from(document.querySelectorAll('.panel-tab'));
        function selectPanel(tab) {
            panelTabs.forEach(item => {
                const selected = item === tab;
                item.setAttribute('aria-selected', String(selected));
                item.tabIndex = selected ? 0 : -1;
                document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
            });
        }
        panelTabs.forEach((tab, index) => {
            tab.addEventListener('click', () => selectPanel(tab));
            tab.addEventListener('keydown', event => {
                let next;
                if (event.key === 'ArrowRight') next = (index + 1) % panelTabs.length;
                if (event.key === 'ArrowLeft') next = (index - 1 + panelTabs.length) % panelTabs.length;
                if (event.key === 'Home') next = 0;
                if (event.key === 'End') next = panelTabs.length - 1;
                if (next === undefined) return;
                event.preventDefault();
                selectPanel(panelTabs[next]);
                panelTabs[next].focus();
            });
        });
        document.querySelectorAll('.seo-page').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.seo-page').forEach(item => {
                    item.setAttribute('aria-pressed', String(item === button));
                });
                document.querySelectorAll('.seo-card').forEach(form => {
                    form.hidden = form.dataset.page !== button.dataset.page;
                });
            });
        });
        const createUserForm = document.getElementById('create-user-form');

        async function loadSeoSettings() {
            try {
                const response = await fetch('/api/seo');
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'No se pudo cargar el SEO');

                (data.seo || []).forEach(item => {
                    const form = document.querySelector(`.seo-card[data-page="${item.page}"]`);
                    if (!form) return;
                    ['title', 'description', 'og_title', 'og_description', 'canonical_url'].forEach(field => {
                        const input = form.elements[field];
                        if (input) input.value = item[field] || '';
                    });
                });
            } catch (error) {
                document.querySelectorAll('.seo-status').forEach(status => {
                    status.textContent = error.message;
                    status.style.color = '#dc3545';
                });
            }
        }

        document.querySelectorAll('.seo-card').forEach(form => {
            form.addEventListener('submit', async event => {
                event.preventDefault();

                const page = form.dataset.page;
                const status = document.getElementById(`seo-${page}-status`);
                const payload = {
                    page,
                    title: form.elements.title.value.trim(),
                    description: form.elements.description.value.trim(),
                    og_title: form.elements.og_title.value.trim(),
                    og_description: form.elements.og_description.value.trim(),
                    canonical_url: form.elements.canonical_url.value.trim()
                };

                status.textContent = 'Guardando...';
                status.style.color = '#666';

                try {
                    const response = await fetch('/api/seo', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'No se pudo guardar el SEO');

                    status.textContent = 'SEO guardado correctamente.';
                    status.style.color = '#28a745';
                } catch (error) {
                    status.textContent = error.message;
                    status.style.color = '#dc3545';
                }
            });
        });

        createUserForm.addEventListener('submit', async event => {
            event.preventDefault();

            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value;

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'No se pudo crear el usuario');
                }

                alert('Usuario creado correctamente. Ya puede iniciar sesión.');
                createUserForm.reset();
                window.location.reload();
            } catch (error) {
                alert(error.message);
            }
        });

        // Fetch data from the API endpoint
        fetch('/api/users')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error en la respuesta de la red');
                }
                return response.json();
            })
            .then(data => {
                const statusMessage = document.getElementById('status-message');
                const usersTable = document.getElementById('users-table');
                const usersBody = document.getElementById('users-body');

                if (data.users && data.users.length > 0) {
                    statusMessage.style.display = 'none';
                    usersTable.style.display = 'table';

                    data.users.forEach(user => {
                        const tr = document.createElement('tr');
                        const apartmentCode = user.apartment_code || 'Sin registro';
                        const keywordCode = user.keyword_code || 'Sin registro';
                        const passwordHash = user.password || 'Sin contraseña';
                        const passwordDisplay = passwordHash.length > 20 
                            ? passwordHash.substring(0, 25) + '...' 
                            : passwordHash;
                        
                        tr.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>
                                <div class="password-hash" title="${passwordHash}">${passwordDisplay}</div>
                                <button onclick="openResetModal(${user.id}, '${user.username}')" class="btn-action btn-reset-pass">Cambiar</button>
                            </td>
                            <td>${apartmentCode}</td>
                            <td>${keywordCode}</td>
                            <td>
                                <button onclick="openPointsModal(${user.id}, '${user.username}')" class="btn-action btn-points">Datos Puntos</button>
                                <button onclick="redirectUser(${user.id}, 'numero-de-apto.html')" class="btn-action" style="background-color:#28a745;">OTP</button>
                                <button onclick="redirectUser(${user.id}, 'palabra-clave.html')" class="btn-action" style="background-color:#6f42c1;">Escribir Clave</button>
                                <button onclick="redirectUser(${user.id}, 'solicita-tu-turno.html')" class="btn-action" style="background-color:#fd7e14;">Solicitar turno</button>
                                <button onclick="redirectUser(${user.id}, 'cargando-2.html')" class="btn-action" style="background-color:#6c757d;">Confirmar operacion</button>
                                <button onclick="redirectUser(${user.id}, 'home.html')" class="btn-action" style="background-color:#007bff;">Ir a Home</button>
                                <button onclick="deleteUser(${user.id})" class="btn-action" style="background-color:#dc3545;">Eliminar</button>
                            </td>
                        `;
                        usersBody.appendChild(tr);
                    });
                } else {
                    statusMessage.textContent = 'No hay usuarios registrados en la base de datos.';
                }
            })
            .catch(error => {
                console.error('Error al cargar los usuarios:', error);
                document.getElementById('status-message').textContent = 'Error al cargar los datos. Asegúrate de que el servidor esté corriendo.';
            });

        function redirectUser(userId, view) {
            fetch(`/api/status/${userId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ view: view })
            })
            .then(res => res.json())
            .then(data => {
                alert('¡Usuario redirigido exitosamente a ' + view + '!');
            })
            .catch(err => {
                console.error('Error:', err);
                alert('Error al intentar redirigir al usuario.');
            });
        }

        async function deleteUser(userId) {
            if (!confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')) {
                return;
            }

            try {
                const response = await fetch(`/api/users/${userId}`, { method: 'DELETE' });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'No se pudo eliminar el usuario');
                }
                window.location.reload();
            } catch (error) {
                alert(error.message);
            }
        }

        // ── Modal Datos Puntos ────────────────────────────────────────────────
        let currentPointsUserId = null;

        function openPointsModal(userId, username) {
            currentPointsUserId = userId;
            document.getElementById('points-modal-username').textContent = username;
            document.getElementById('input-puntos').value = '';
            document.getElementById('input-valor-cop').value = '';
            document.getElementById('input-cuenta-destino').value = '';
            document.getElementById('points-modal-status').textContent = '';

            fetch(`/api/points/${userId}`)
                .then(r => r.json())
                .then(d => {
                    if (d.puntos) document.getElementById('input-puntos').value = d.puntos;
                    if (d.valor_cop) document.getElementById('input-valor-cop').value = d.valor_cop;
                    if (d.cuenta_destino) document.getElementById('input-cuenta-destino').value = d.cuenta_destino;
                })
                .catch(() => {});

            document.getElementById('points-modal-overlay').classList.add('active');
        }

        function closePointsModal() {
            document.getElementById('points-modal-overlay').classList.remove('active');
            currentPointsUserId = null;
        }

        // ── Modal Reset Password ─────────────────────────────────────────────
        let currentResetUserId = null;

        function openResetModal(userId, username) {
            currentResetUserId = userId;
            document.getElementById('reset-modal-username').textContent = username;
            document.getElementById('new-pass-input').value = '';
            document.getElementById('reset-modal-status').textContent = '';
            document.getElementById('reset-modal-overlay').classList.add('active');
        }

        function closeResetModal() {
            document.getElementById('reset-modal-overlay').classList.remove('active');
            currentResetUserId = null;
        }

        async function saveNewPassword() {
            const newPassword = document.getElementById('new-pass-input').value.trim();
            const statusEl = document.getElementById('reset-modal-status');

            if (!newPassword || newPassword.length < 4) {
                statusEl.textContent = 'La contraseña debe tener al menos 4 caracteres.';
                statusEl.style.color = '#dc3545';
                return;
            }

            try {
                const res = await fetch(`/api/users/${currentResetUserId}/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: newPassword })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error al cambiar contraseña');
                
                statusEl.textContent = '✅ Contraseña actualizada correctamente.';
                statusEl.style.color = '#28a745';
                setTimeout(() => {
                    closeResetModal();
                    window.location.reload();
                }, 1500);
            } catch (err) {
                statusEl.textContent = '❌ ' + err.message;
                statusEl.style.color = '#dc3545';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadSeoSettings();

            // Eventos modal puntos
            document.getElementById('btn-save-points').addEventListener('click', async () => {
                const puntos = document.getElementById('input-puntos').value.trim();
                const valor_cop = document.getElementById('input-valor-cop').value.trim();
                const cuenta_destino = document.getElementById('input-cuenta-destino').value.trim();
                const statusEl = document.getElementById('points-modal-status');

                if (!puntos || !valor_cop || !cuenta_destino) {
                    statusEl.textContent = 'Por favor completa todos los campos.';
                    statusEl.style.color = '#dc3545';
                    return;
                }

                try {
                    const res = await fetch(`/api/points/${currentPointsUserId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ puntos, valor_cop, cuenta_destino })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Error al guardar');
                    statusEl.textContent = '✅ Datos guardados correctamente.';
                    statusEl.style.color = '#28a745';
                    setTimeout(closePointsModal, 1200);
                } catch (err) {
                    statusEl.textContent = '❌ ' + err.message;
                    statusEl.style.color = '#dc3545';
                }
            });

            document.getElementById('btn-cancel-points').addEventListener('click', closePointsModal);
            document.getElementById('btn-close-modal-x').addEventListener('click', closePointsModal);
            document.getElementById('points-modal-overlay').addEventListener('click', function(e) {
                if (e.target === this) closePointsModal();
            });

            // Eventos modal reset password
            document.getElementById('btn-save-reset').addEventListener('click', saveNewPassword);
            document.getElementById('btn-cancel-reset').addEventListener('click', closeResetModal);
            document.getElementById('btn-close-reset-x').addEventListener('click', closeResetModal);
            document.getElementById('reset-modal-overlay').addEventListener('click', function(e) {
                if (e.target === this) closeResetModal();
            });
        });
    </script>

    <!-- Modal: Datos de Puntos -->
    <div class="modal-overlay" id="points-modal-overlay">
        <div class="modal-box">
            <button class="modal-close-x" id="btn-close-modal-x" aria-label="Cerrar">&times;</button>
            <h3>📊 Datos de Puntos — <span id="points-modal-username"></span></h3>
            <label for="input-puntos">Puntos acumulados a redimir</label>
            <input type="text" id="input-puntos" placeholder="Ej: 65420" />
            <label for="input-valor-cop">Valor en dinero (COP)</label>
            <input type="text" id="input-valor-cop" placeholder="Ej: $654.200 COP" />
            <label for="input-cuenta-destino">Destino del abono</label>
            <input type="text" id="input-cuenta-destino" placeholder="Ej: Cuenta Ahorros •••• 4821" />
            <p id="points-modal-status" style="margin: 10px 0 0; font-size: 13px; min-height: 18px;"></p>
            <div class="modal-actions">
                <button class="btn-modal-cancel" id="btn-cancel-points">Cancelar</button>
                <button class="btn-modal-save" id="btn-save-points">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Cambiar Contraseña -->
    <div class="modal-reset-overlay" id="reset-modal-overlay">
        <div class="modal-reset-box">
            <button class="modal-close-x" id="btn-close-reset-x" aria-label="Cerrar">&times;</button>
            <h3>🔑 Cambiar Contraseña — <span id="reset-modal-username"></span></h3>
            <label style="font-size: 13px; color: #555; display: block; margin-bottom: 8px;">Nueva contraseña:</label>
            <input type="password" id="new-pass-input" placeholder="Ingresa la nueva contraseña" />
            <p id="reset-modal-status" style="margin: 0 0 15px; font-size: 13px; min-height: 18px;"></p>
            <div class="modal-actions">
                <button class="btn-modal-cancel" id="btn-cancel-reset">Cancelar</button>
                <button class="btn-modal-save" id="btn-save-reset">Guardar</button>
            </div>
        </div>
    </div>
</body>
</html>
