  <!-- Contenido principal / Loader view -->
  <main class="cargando-main">
    <div class="cargando-card" role="status" aria-live="polite">
      
      <!-- Spinner institucional -->
      <div class="app-spinner-container">
        <svg class="app-spinner-svg" viewBox="0 0 80 80">
          <circle class="app-spinner-track" cx="40" cy="40" r="32"></circle>
          <circle class="app-spinner-arc" cx="40" cy="40" r="32"></circle>
        </svg>
        <div class="app-spinner-dot"></div>
        <div class="app-spinner-center-pulse"></div>
      </div>

      <!-- Titulo y textos -->
      <h1 class="cargando-title">
        <span id="cargandoTitleText" data-i18n="CARGANDO_TITLE_TEXT">{{CARGANDO_TITLE_TEXT}}</span><span class="cargando-dots"><span>.</span><span>.</span><span>.</span></span>
      </h1>
      
      <p class="cargando-subtitle" id="cargandoSubtitle" data-i18n="CARGANDO_SUBTITLE">
        {{CARGANDO_SUBTITLE}}
      </p>

      <!-- Barra de progreso -->
      <div class="cargando-progress-bar-wrapper">
        <div class="cargando-progress-bar-fill"></div>
      </div>

      <!-- Reaseguro de seguridad -->
      <div class="cargando-security-note">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C9.24 2 7 4.24 7 7v3H6c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v3H9V7c0-1.66 1.34-3 3-3zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/>
        </svg>
        <span data-i18n="CARGANDO_SECURITY_NOTE">{{CARGANDO_SECURITY_NOTE}}</span>
      </div>

    </div>
  </main>

  <!-- Footer institucional -->
  <footer class="cargando-footer">
    <p data-i18n="CARGANDO_FOOTER">{{CARGANDO_FOOTER}}</p>
  </footer>

  <script src="assets/js/cargando.js"></script>
</body>
</html>
